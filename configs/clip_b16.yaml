name: clip_b16
model: clip
arch: ViT-B-16
pretrained: openai
h: 256
w: 128
epochs: 8
batch_size: 64
lr: 3.0e-5
head_lr: 1.0e-3
wd: 0.05
layer_decay: 0.7
warmup_epochs: 1
ema_decay: 0.999
balanced: true
degrade: true
degrade_p: 0.3
weighted_loss: true
text_init: results/zeroshot/text_weights.npz
num_workers: 8
eval_raw: true
